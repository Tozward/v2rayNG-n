name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Setup Go 1.27 for native Core
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'

    - name: Build libv2ray with Go 1.27 for armeabi-v7a
      working-directory: AndroidLibXrayLite
      run: |
        go version
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH="$(go env GOPATH)/bin:$PATH"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

        mkdir -p assets data
        bash gen_assets.sh download
        cp -v data/*.dat assets/

        gomobile init
        go mod tidy
        gomobile bind -v -target=android/arm -androidapi 24 \
          -trimpath \
          -ldflags='-s -w -buildid= -checklinkname=0' ./

        mkdir -p ../V2rayNG/app/libs
        cp libv2ray.aar ../V2rayNG/app/libs/libv2ray.aar

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      working-directory: V2rayNG
      env:
        KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew :app:assembleFdroidRelease \
          -PABI_FILTERS=armeabi-v7a \
          "-Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }}" \
          "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
          "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
          "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
       
    - name: Upload signed TV APK
      uses: actions/upload-artifact@v7
      with:
        name: v2rayNG-tv-go127-armeabi-v7a
        path: V2rayNG/app/build/outputs/apk/fdroid/release/*armeabi-v7a*.apk
        if-no-files-found: error

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/v2rayN-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
