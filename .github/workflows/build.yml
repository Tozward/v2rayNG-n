name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
      source_run_id:
        required: false
        type: string
      prerelease:
        required: false
        type: boolean
        default: false
      debug_only:
        description: Validate debug APKs without release packaging or publishing
        required: false
        type: boolean
        default: false
      device_audit:
        description: Also build isolated arm64 audit APKs; never publish these packages
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master

permissions:
  actions: read
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.source_run_id == '' || inputs.debug_only || inputs.device_audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Go
      id: go
      uses: actions/setup-go@v6
      with:
        go-version-file: native/singtun/go.mod
        cache-dependency-path: native/singtun/go.sum

    - name: Test Sing TUN adapter
      working-directory: native/singtun
      run: |
        go test -race -tags with_sing_tun -timeout 60s ./...
        go vet -tags with_sing_tun ./...
        go test -race -tags with_sing_tun -c -o "$RUNNER_TEMP/singtun.test" .
        sudo "$RUNNER_TEMP/singtun.test" -test.run TestKernelFD -test.count 20 -test.v -test.timeout 120s

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Restore integrated core
      id: cache-integrated-core
      uses: actions/cache/restore@v6
      with:
        path: V2rayNG/app/libs/libv2ray.aar
        key: sing-core-${{ runner.os }}-${{ env.NDK_HOME }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('.git/modules/AndroidLibXrayLite/HEAD', 'AndroidLibXrayLite/go.mod', 'native/singtun/go.mod', 'native/singtun/go.sum', 'native/singtun/controller.go', 'native/singtun/core_android.go', 'native/singtun/device_linux.go', 'native/singtun/device_other.go', 'compile-singtun.sh', 'LICENSE') }}

    - name: Build integrated core
      if: steps.cache-integrated-core.outputs.cache-hit != 'true'
      run: bash compile-singtun.sh

    - name: Save integrated core
      if: steps.cache-integrated-core.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: V2rayNG/app/libs/libv2ray.aar
        key: ${{ steps.cache-integrated-core.outputs.cache-primary-key }}

    - name: Preserve native inputs for the isolated device audit
      if: inputs.device_audit
      uses: actions/upload-artifact@v7
      with:
        name: native-audit-inputs
        path: |
          V2rayNG/app/libs/libv2ray.aar
          V2rayNG/app/libs/**/*.so
        if-no-files-found: error
        retention-days: 7

    - name: Build an Android HEV descriptor runner for matched core measurements
      if: inputs.device_audit
      run: |
        mkdir -p phone-fixtures
        "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
          -O3 -Ihev-socks5-tunnel/include tools/ci/phone_hev_runner.c \
          -LV2rayNG/app/libs/arm64-v8a -lhev-socks5-tunnel \
          -o phone-fixtures/hev-runner
        cp V2rayNG/app/libs/arm64-v8a/libhev-socks5-tunnel.so phone-fixtures/

    - name: Preserve matched Android HEV runner
      if: inputs.device_audit
      uses: actions/upload-artifact@v7
      with:
        name: phone-hev-fixture
        path: phone-fixtures
        if-no-files-found: error
        retention-days: 7

    - name: Build shell-UID probe without the device's app_process runtime
      if: inputs.device_audit
      run: |
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
          -o phone-fixtures/audit-probe tools/ci/phoneprobe/main.go

    - name: Preserve isolated phone probe
      if: inputs.device_audit
      uses: actions/upload-artifact@v7
      with:
        name: phone-audit-probe
        path: phone-fixtures/audit-probe
        if-no-files-found: error
        retention-days: 7

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Prepare Gradle and license report
      working-directory: V2rayNG
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport

    - name: Focused application regressions
      working-directory: V2rayNG
      timeout-minutes: 15
      run: |
        ./gradlew :app:testPlaystoreDebugUnitTest --tests com.v2ray.ang.core.CoreBackendSnapshotTest --tests com.v2ray.ang.core.CoreTunConfigTest --tests com.v2ray.ang.core.CoreLocalProxyConfigTest --tests com.v2ray.ang.handler.UpdateProxyAuthenticationTest --tests com.v2ray.ang.util.HttpUtilProxyAuthenticationTest --tests com.v2ray.ang.handler.UpdateCacheCleanupTest
        ./gradlew :app:testPlaystoreDebugUnitTest --tests com.v2ray.ang.dto.VlessTestpreTest --tests com.v2ray.ang.dto.TunBackendTest --tests com.v2ray.ang.ui.server.ServerVlessViewModelTest --tests com.v2ray.ang.service.NetworkHandoverStateTest --tests com.v2ray.ang.service.VpnLifecycleGateTest --tests com.v2ray.ang.ui.perappproxy.PerAppProxyViewModelTest --tests com.v2ray.ang.util.AppManagerUtilTest --tests com.v2ray.ang.handler.UpdateCheckerManagerTest --tests com.v2ray.ang.helper.MessageHelperTest --tests com.v2ray.ang.ui.checkupdate.CheckUpdateViewModelTest --tests com.v2ray.ang.ui.userasset.UserAssetViewModelTest --tests com.v2ray.ang.ui.settings.SettingsViewModelTest --tests com.v2ray.ang.handler.SubscriptionInfoParserTest --tests com.v2ray.ang.ui.main.MainSubscriptionInfoTest --tests com.v2ray.ang.fmt.Hysteria2FmtTest --tests com.v2ray.ang.root.RootProxyManagerTest

    - name: Full unit tests and debug builds for both distributions
      working-directory: V2rayNG
      timeout-minutes: 20
      run: |
        ./gradlew :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin :app:assemblePlaystoreDebug
        ./gradlew :app:testFdroidDebugUnitTest :app:compileFdroidDebugKotlin :app:assembleFdroidDebug

    - name: Compile Android instrumentation
      working-directory: V2rayNG
      timeout-minutes: 15
      run: ./gradlew :app:assemblePlaystoreDebugAndroidTest

    - name: Lint both distributions
      working-directory: V2rayNG
      timeout-minutes: 15
      run: ./gradlew :app:lintPlaystoreDebug :app:lintFdroidDebug

    - name: Build signed release APKs
      if: ${{ !inputs.debug_only }}
      working-directory: V2rayNG
      timeout-minutes: 20
      env:
        ANDROID_KEYSTORE_FILE: ${{ steps.android_keystore.outputs.filePath }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          "-Pandroid.injected.signing.store.file=$ANDROID_KEYSTORE_FILE" \
          "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
          "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
          "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"

    - name: Preserve JVM and lint reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: app-test-reports
        path: |
          V2rayNG/app/build/test-results/
          V2rayNG/app/build/reports/tests/
          V2rayNG/app/build/reports/lint-results-*
        if-no-files-found: ignore
        retention-days: 7

    - name: Verify native libraries in APKs
      env:
        APK_BUILD_TYPE: ${{ inputs.debug_only && 'debug' || 'release' }}
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        from zipfile import ZipFile

        abis = ('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64')
        apks = list(Path('V2rayNG/app/build/outputs/apk').glob(f"*/{os.environ['APK_BUILD_TYPE']}/*.apk"))
        if len(apks) != 10:
            raise SystemExit(f'Expected 10 APKs, found {len(apks)}')
        for apk in apks:
            targets = abis if apk.stem.endswith('_universal') else [abi for abi in abis if apk.stem.endswith(f'_{abi}')]
            if not targets:
                raise SystemExit(f'Unknown APK ABI: {apk.name}')
            with ZipFile(apk) as archive:
                assert archive.getinfo('assets/sing-tun-LICENSE.txt').file_size > 0
                for abi in targets:
                    for library in ('libgojni.so', 'libhev-socks5-tunnel.so', 'libhevsockstun.so'):
                        entry = f'lib/{abi}/{library}'
                        if archive.getinfo(entry).file_size == 0:
                            raise SystemExit(f'Empty native library: {apk.name}: {entry}')
            print(f'Verified native libraries: {apk.name}')
        PY
    
    - name: Upload emulator test APKs
      uses: actions/upload-artifact@v7
      with:
        name: emulator-tests
        path: |
          V2rayNG/app/build/outputs/apk/playstore/debug/*x86_64*.apk
          V2rayNG/app/build/outputs/apk/androidTest/playstore/debug/*.apk

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() && !inputs.debug_only }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() && !inputs.debug_only }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{ success() && !inputs.debug_only }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() && !inputs.debug_only }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  android-smoke:
    needs: build
    if: always() && (needs.build.result == 'success' || (inputs.source_run_id != '' && inputs.release_tag == '' && !inputs.device_audit && !inputs.debug_only))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Resolve emulator source artifacts
        id: emulator-source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" = success ]; then
            SOURCE_RUN_ID="$GITHUB_RUN_ID"
          else
            read -r RESULT BRANCH SHA REPOSITORY <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '[.conclusion, .head_branch, .head_sha, .head_repository.full_name] | @tsv')"
            if [ "$RESULT" != success ] || [ "$BRANCH" != "$GITHUB_REF_NAME" ] || [ "$REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "Emulator source must be a successful build on this branch and repository" >&2
              exit 1
            fi
            echo "Rechecking compiled source $SHA"
          fi
          echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: emulator-tests
          path: emulator-tests
          run-id: ${{ steps.emulator-source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start echo fixture
        run: python3 tools/ci/socks_echo.py > "$RUNNER_TEMP/socks-echo.log" 2>&1 &
      - name: Test Android VPN backends
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/ci/android_backend_smoke.sh
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/instrumentation.txt
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/socks-echo.log
            ${{ runner.temp }}/update-cache-replacement.txt

  device-audit:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.device_audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - uses: actions/download-artifact@v8
        with:
          name: native-audit-inputs
          path: V2rayNG/app/libs
      - name: Build a scratch-only package from the verified native inputs
        working-directory: V2rayNG
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          source = path.read_text()
          needle = 'applicationId = "com.v2ray.ang"'
          assert source.count(needle) == 1, 'Unexpected applicationId declaration'
          # Debug signing keys can differ between hosted runners. A reserved,
          # run-specific ID avoids uninstalling an earlier audit's scratch data.
          audit_id = 'com.v2ray.ang.audit.r' + str(int(os.environ['GITHUB_RUN_ID']))
          path.write_text(source.replace(needle, 'applicationId = "' + audit_id + '"'))
          PY
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew :app:assemblePlaystoreDebug :app:assemblePlaystoreDebugAndroidTest -PABI_FILTERS=arm64-v8a
          APK=$(find app/build/outputs/apk/playstore/debug -name '*arm64-v8a*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$APK" > audit-package.txt
          grep -q "^package: name='com.v2ray.ang.audit.r${GITHUB_RUN_ID}' " audit-package.txt
      - name: Preserve isolated device audit APKs
        uses: actions/upload-artifact@v7
        with:
          name: device-audit-apks
          path: |
            V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk
            V2rayNG/app/build/outputs/apk/androidTest/playstore/debug/*.apk
            V2rayNG/audit-package.txt
          if-no-files-found: error
          retention-days: 7

  sign-and-release:
    needs: [build, android-smoke]
    runs-on: ubuntu-26.04
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.debug_only && !inputs.device_audit && inputs.release_tag != '' && ((needs.build.result == 'success' && needs.android-smoke.result == 'success') || inputs.source_run_id != '')
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}

    steps:
      - name: Resolve source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ -n "$SOURCE_RUN_ID" ]; then
            read -r RESULT BRANCH SHA REPOSITORY <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '[.conclusion, .head_branch, .head_sha, .head_repository.full_name] | @tsv')"
            if [ "$RESULT" != success ] || [ "$BRANCH" != "$GITHUB_REF_NAME" ] || [ "$REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "Source run must be a successful build on this branch and repository" >&2
              exit 1
            fi
          else
            SOURCE_RUN_ID="$GITHUB_RUN_ID"
            SHA="$GITHUB_SHA"
          fi
          echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare APK files
        run: |
          mkdir -p release-files
          find release -type f -name '*.apk' ! -path 'release/emulator-tests/*' ! -path 'release/device-audit-apks/*' -exec cp {} release-files/ \;
          test -n "$(find release-files -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Sign APK files with GPG when configured
        if: env.HAS_GPG_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          find release-files -type f -name '*.apk' | while read apk; do
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/v2rayN-public-key.asc

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          for APK in release-files/*.apk; do
            case "$(basename "$APK")" in
              "v2rayNG_${VERSION}_"*.apk|"v2rayNG_${VERSION}-fdroid_"*.apk) ;;
              *) echo "APK version does not match release tag: $APK" >&2; exit 1 ;;
            esac
          done
          for VARIANT in '' '-fdroid'; do
            for ABI in arm64-v8a armeabi-v7a x86 x86_64 universal; do
              test -s "release-files/v2rayNG_${VERSION}${VARIANT}_${ABI}.apk" || {
                echo "Missing APK: ${VERSION}${VARIANT}_${ABI}" >&2; exit 1;
              }
            done
          done
          NOTES="Synced with upstream v2.3.15. Includes subscription usage information and the redesigned group tabs, VLESS Vision testpre, VPN lifecycle and network monitoring improvements, faster per-app loading and search, in-app updates, and bounded concurrent geo-file downloads. When the current daemon is running, app and geo-file downloads use its local proxy; otherwise they connect directly. Downloads never start the VPN or change nodes. APKs are signed with this fork's Android keystore."
          if test -f release-files/v2rayN-public-key.asc; then
            NOTES="$NOTES Detached GPG signatures are included."
          else
            NOTES="$NOTES Detached GPG signatures are unavailable for this release."
          fi
          if [[ "$PRERELEASE" == true || "$RELEASE_TAG" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease)
          else
            RELEASE_FLAGS=(--latest)
          fi
          DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$DRAFT" = true ]; then
            gh release upload "$RELEASE_TAG" release-files/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ -n "$DRAFT" ]; then
            echo "Release already published: $RELEASE_TAG" >&2
            exit 1
          else
            gh release create "$RELEASE_TAG" release-files/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$RELEASE_TAG" \
              --notes "$NOTES" \
              "${RELEASE_FLAGS[@]}"
          fi
